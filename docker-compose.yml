# GPU training and inference for Windows Docker Desktop (WSL2) and Linux NVIDIA hosts.
# Same Compose file on both. Prerequisites:
#   Windows: Docker Desktop with WSL2 backend + NVIDIA GPU support enabled
#   Linux:   NVIDIA driver + nvidia-container-toolkit
#
# Smoke GPU:    docker compose run --rm gpu-check
# Train:        docker compose run --rm train
# Infer only:   docker compose --profile infer run --rm infer
# Optional FA2: docker compose build --build-arg INSTALL_FLASH_ATTN=true \
#                 --build-arg BASE_IMAGE=nvidia/cuda:12.4.1-cudnn-devel-ubuntu22.04

x-gpu-reservations: &gpu-reservations
  driver: nvidia
  count: all
  capabilities: [gpu]

x-common: &common
  build:
    context: .
    dockerfile: Dockerfile
    args:
      INSTALL_FLASH_ATTN: "false"
  image: ai-factory:gpu
  working_dir: /workspace
  env_file:
    - path: .env
      required: false
  environment:
    HF_HOME: /hf-cache
    NVIDIA_VISIBLE_DEVICES: all
    NVIDIA_DRIVER_CAPABILITIES: compute,utility
  shm_size: "16gb"
  deploy:
    resources:
      reservations:
        devices:
          - *gpu-reservations

services:
  gpu-check:
    <<: *common
    volumes:
      - hf-cache:/hf-cache
    command:
      - python
      - -c
      - |
        import shutil
        import subprocess
        import torch

        print("torch", torch.__version__)
        print("cuda_available", torch.cuda.is_available())
        print("cuda_version", torch.version.cuda)
        if torch.cuda.is_available() and torch.cuda.device_count() > 0:
            print("device", torch.cuda.get_device_name(0))
        else:
            print("device CPU")
        nvidia_smi = shutil.which("nvidia-smi")
        if nvidia_smi:
            subprocess.run([nvidia_smi], check=False)

  train:
    <<: *common
    volumes:
      # Bind the whole package so host Python/config/data apply without rebuild.
      - ./src:/workspace/src
      - hf-cache:/hf-cache
    command:
      - python
      - -m
      - src.main
      - --config-path
      - src/config.yaml

  infer:
    <<: *common
    profiles: ["infer"]
    environment:
      HF_HOME: /hf-cache
      NVIDIA_VISIBLE_DEVICES: all
      NVIDIA_DRIVER_CAPABILITIES: compute,utility
      AGENT_ALLOWED_READ_PATH: /data/allowed/read
      AGENT_ALLOWED_WRITE_PATH: /data/allowed/write
    volumes:
      - ./src:/workspace/src
      - ./data/allowed/read:/data/allowed/read
      - ./data/allowed/write:/data/allowed/write
      - hf-cache:/hf-cache
    command:
      - python
      - -m
      - src.main
      - --config-path
      - src/config.yaml
      - --inference-only

volumes:
  hf-cache:
