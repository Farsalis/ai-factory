# ==============================================================================
# Enhanced QLoRA and DPO Fine-Tuning Configuration
# Tuned for a desktop RTX 4070 (12GB VRAM) + ~128GB host RAM, typically via
# Docker Desktop (Linux CUDA container). Prioritizes finishing a run over
# mid-train eval / full multimodal merge. Do not raise batch size until 2048
# seq length completes without CUDA OOM (previous 4096/batch-4 run sat at ~96% VRAM).
# ==============================================================================

# --- Data Configuration ---
# Point to ICDU-formatted JSONL files for training and validation.
# Format: JSON Lines (.jsonl), with each line containing ICDU fields (e.g., application_prompt, ideal_response_final).
data:
  # v9 clean core: source-preserved examples with disjoint prompt-family splits.
  # The sealed test set is intentionally not loaded during training.
  train_file: "./data/datasets/icdu_training_data_v9.jsonl"
  validation_file: "./data/datasets/icdu_validation_data_v9.jsonl"

# --- Model Configuration ---
# Defines the base model and its core parameters.
model:
  name: "Qwen/Qwen3.5-9B"  # dpo.py uses this to resolve model location, either HF identifier or relative path to dpo.py
  # 2048 is ~4x cheaper attention than 4096; ICDU prompts still fit for a first finishable run.
  max_length: 2048
  # Default Docker image has no flash_attn (falls back to SDPA anyway). Set
  # flash_attention_2 after a successful INSTALL_FLASH_ATTN image rebuild.
  attn_implementation: "sdpa"
  trust_remote_code: true
  use_linear_attention_kernels: false
  # Text-only load (AutoModelForCausalLM). Faster and less VRAM than keeping the
  # vision tower. Set true only if the merged checkpoint must stay multimodal.
  preserve_all_tensors: false

# --- Quantization Configuration ---
# Settings for 4-bit QLoRA to minimize memory usage.
quantization:
  enabled: true
  quant_type: "nf4"
  use_double_quant: true

# --- LoRA Configuration ---
# Parameters for Low-Rank Adaptation (LoRA) fine-tuning.
lora:
  r: 32
  alpha: 32
  dropout: 0.05
  target_modules:
    - "q_proj"
    - "k_proj"
    - "v_proj"
    - "o_proj"
    - "gate_proj"
    - "up_proj"
    - "down_proj"

# --- Training Configuration ---
# Parameters for SFT training loop (via Hugging Face's TrainingArguments).
training:
  output_dir: "./training_output"
  seed: 42
  num_train_epochs: 1
  per_device_train_batch_size: 4
  per_device_eval_batch_size: 4
  gradient_accumulation_steps: 2
  optim: "paged_adamw_8bit"
  learning_rate: 0.0002
  weight_decay: 0.001
  max_grad_norm: 0.3
  warmup_ratio: 0.03
  lr_scheduler_type: "cosine"
  # Mid-train eval over 1.5k val rows at long context dominated wall-clock time.
  evaluation_strategy: "no"
  eval_steps: 500
  save_strategy: "epoch"
  save_steps: 500
  save_total_limit: 1
  save_only_model: true
  logging_steps: 10
  group_by_length: true
  gradient_checkpointing: true
  report_to: "none"
  load_best_model_at_end: false
  metric_for_best_model: "eval_loss"
  greater_is_better: false
  remove_unused_columns: true
  # Linux container + high host/WSL RAM (optimizer would pick 4, not Windows 2).
  dataloader_num_workers: 4

# --- DPO Configuration ---
# Parameters for Direct Preference Optimization (DPO) training.
# DPO expects messages-format JSONL (chat with tool calls). Use train_file when SFT
# uses ICDU data (data.train_file) so DPO can use a separate augmented chat file.
dpo:
  train_file: "./data/datasets/augmented_datasets/breaking_better/bb_training_data_v7.jsonl"  # optional; fallback: data.train_file
  output_dir: "./training_output"
  learning_rate: 0.000005
  beta: 0.1
  max_steps: 100
  lora_rank: 32
  per_device_train_batch_size: 2
  per_device_eval_batch_size: 2
  gradient_accumulation_steps: 2
  optim: "paged_adamw_8bit"
  lr_scheduler_type: "cosine"
  eval_steps: 100
  save_steps: 100
  save_total_limit: 1
  logging_steps: 10
  gradient_checkpointing: true
  warmup_ratio: 0.03
  torch_compile: true  # Triton is available in the Linux CUDA container
